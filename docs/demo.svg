<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of login-defs-audit on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">login-defs-audit</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>bin/login-defs-audit examples</text><text class="r d0 " x="20" y="108" xml:space="preserve">4 files, 11 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">HIGH     LGN004 legacy/login.defs:5</text><text class="r d2 " x="20" y="152" xml:space="preserve">         ENCRYPT_METHOD MD5: new password hashes are weak</text><text class="r d3 m" x="20" y="174" xml:space="preserve">MEDIUM   LGN001 legacy/login.defs:2</text><text class="r d4 " x="20" y="196" xml:space="preserve">         PASS_MAX_DAYS is 99999: passwords live longer than a year</text><text class="r d5 m" x="20" y="218" xml:space="preserve">MEDIUM   LGN005 legacy/login.defs:6</text><text class="r d6 " x="20" y="240" xml:space="preserve">         UMASK 022 leaves new files readable by other users: use 027 or stricter</text><text class="r d7 m" x="20" y="262" xml:space="preserve">MEDIUM   LGN008 legacy/pwquality.conf.d/local.conf:1</text><text class="r d8 " x="20" y="284" xml:space="preserve">         no complexity rule: set minclass to 3 or more, or negative dcredit, ucredit, lcredit and ocredi</text><text class="r d9 m" x="20" y="306" xml:space="preserve">MEDIUM   LGN007 legacy/pwquality.conf.d/local.conf:2</text><text class="r d10 " x="20" y="328" xml:space="preserve">         minlen is 8: use at least 12</text><text class="r d11 m" x="20" y="350" xml:space="preserve">MEDIUM   LGN009 legacy/pwquality.conf.d/local.conf:3</text><text class="r d12 " x="20" y="372" xml:space="preserve">         dictcheck = 0: dictionary words are accepted</text><text class="r d13 m" x="20" y="394" xml:space="preserve">MEDIUM   LGN010 legacy/pwquality.conf.d/local.conf:4</text><text class="r d14 " x="20" y="416" xml:space="preserve">         enforcing = 0: weak passwords only produce a warning</text><text class="r d15 l" x="20" y="438" xml:space="preserve">LOW      LGN002 legacy/login.defs:3</text></svg>
